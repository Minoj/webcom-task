services:
    php:
        build:
            context: ./docker/php
        container_name: webcom_php
        volumes:
            - ./:/var/www
        networks:
            - webcom

    nginx:
        image: nginx:alpine
        container_name: webcom_nginx
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
        networks:
            - webcom

    mysql:
        image: mysql:8.4
        container_name: webcom_mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: webcom
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: webcom
            MYSQL_PASSWORD: secret
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - webcom

networks:
    webcom:

volumes:
    mysql_data:
